# Independently resolved excavator SI profile; see docs/excavator-planning.md.
units: si
initialization:
  # Excavator initializes from model_<id>_mesh.ply and pads both XY footprints.
  height_clearance: 0.15
  xy_padding: 0.12
filtering:
  posegen_gap_threshold: 0.005
  posegen_equilibrium_threshold: 1.0
  # Reject solved placements above the lowest layer until its fill target is met.
  strict_floor_first: true
  require_solver_convergence: false
  reject_equilibrium_at_threshold: true
planar:
  grid_shape: [32, 32]
  yaw_angles_degrees: [0, 90, 180, 270]
  minimum_xy_separation: 0.0  # Legacy scored selection has no distance thinning.
  target_anchor_inset_scale: 0.6
orientation:
  pose_from_scan: false
  roll_angles_degrees: [0, 180]
floor:
  # Advance once the current layer covers 60% of the base in top-down projection.
  coverage_mode: projected_footprint
  bottom_tolerance: 0.2
  fill_ratio: 0.6
  grid_size: 16  # Coarse coverage estimate; 256 cell-center samples.
  max_layers: 8
  minimum_contact_cells: 1
  score_weights: [-3.0, 2.0, 1.0, 2.0, 1.0, 1.5]
scored_sampling:
  # Active score-mode settings from stacking-planner agent/configs/ablation.yml.
  boltzmann_temperature: 0.3
  boltzmann_min_probability: 0.0
  target_mask_margin: 0.0
  contact_gap_tolerance: 0.10
  score:
    height: -3.0
    support_likelihood: 2.0
    open_area: 1.0
    fill_area: 2.0
    frontier: 1.0
    target_boundary: 1.5
    excavator_distance: 2.0
    excavator_distance_axis: xy
    excavator_xy: null
    elite_fraction: 0.25
  floor_fill:
    connected_after: 1
    u_shape_filter: false
    u_shape_footprint_scale: 0.9
    u_shape_min_frontier_contact_cells: 1
    lower_floor_fill_ratio: 0.6
    lower_floor_occupancy_grid: 16
    lower_floor_bottom_z_tolerance: 0.2
    lower_floor_max_layers: 8
    lower_floor_fill_reject_stacked: false
