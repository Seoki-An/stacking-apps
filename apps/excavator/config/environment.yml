# Independently resolved excavator SI profile; see docs/excavator-planning.md.
units: si
observation:
  action_sample_count: 96
  max_poses_per_object: 32
  surface_sample_count: 128
  banned_object_ids: []
  height_map_resolution: [128, 128]
  height_map_margin: 1.0
  render_height_map: true
reward:
  overlap_resolution: 0.03
  posegen_threshold: 1.0
  containment_threshold: 0.5
  nonfinite_displacement: 2.0
  max_displacement: 1.0
  # Velocity disturbances from the nominal settled scene; poses stay unchanged.
  place_stability:
    enabled: true
    n_noise: 4
    # Provisional disturbance magnitudes; calibrate to release velocity measurements.
    linear_velocity_std: [0.05, 0.05, 0.05]  # World XYZ, m/s (signed Gaussian).
    angular_velocity_std_deg: 5.0  # Body XYZ, deg/s, isotropic Gaussian.
    rotation_weight: 0.1
    # Require recovery (energy settling or bounded rocking) in every trial.
    reject_failed_trials: true
    # Practical settling over the existing quiet window (provisional tolerances).
    settling_position_tolerance: 0.002
    settling_rotation_tolerance_deg: 0.5
    # Peak trial excursion: translation (m) + rotation_weight * angle (rad).
    fail_displacement: 0.15
    seed: 0
  weights:
    stability: 2.0
    object_containment: 2.0
    target_overlap_increment: 20.0
    place_stability: 2.0
    large_object_lower: 3.0
    inward_orientation: 6.0
