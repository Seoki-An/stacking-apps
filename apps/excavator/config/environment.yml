# Independently resolved excavator SI profile; see docs/excavator-planning.md.
units: si
observation:
  action_sample_count: 96
  max_poses_per_object: 32
  surface_sample_count: 128
  banned_object_ids: []
  height_map_resolution: [128, 128]
  height_map_margin: 1.0
  render_height_map: true
reward:
  overlap_resolution: 0.03
  posegen_threshold: 1.0  # Legacy reward fallback; native equilibrium uses body weight/size.
  containment_threshold: 0.5
  nonfinite_displacement: 2.0
  max_displacement: 1.0
  # Reward unit in metres of combined excursion; matches the current failure limit.
  displacement_reference: 0.15
  # Horizontal COM-force probes from the nominal settled scene.
  place_stability:
    enabled: true
    n_noise: 8  # Equally spaced world XY directions.
    contact_hops: null  # All placed stones remain movable.
    force_ratio: 0.05  # Force = ratio * candidate mass * gravity magnitude.
    force_duration: 1.0  # Seconds; then observe free recovery.
    rotation_weight: 0.1
    # Require recovery (energy settling or bounded rocking) in every trial.
    reject_failed_trials: true
    # Practical settling over the existing quiet window (provisional tolerances).
    settling_position_tolerance: 0.002
    settling_rotation_tolerance_deg: 0.5
    # Peak trial excursion: translation (m) + rotation_weight * angle (rad).
    fail_displacement: 0.15
  weights:
    stability: 10.0
    object_containment: 2.0
    # Added target volume / initial inventory mean stone volume; average full stone = 1.
    target_overlap_increment: 1.0
    # Reward reduction in area-weighted height variance / mean-stone volume^(2/3), including empty floor.
    surface_flatness: 8.0
    place_stability: 4.0
    large_object_lower: 0.0
    inward_orientation: 0.0
