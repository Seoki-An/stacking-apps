# Independently resolved excavator SI profile; see docs/excavator-planning.md.
units: si
observation:
  action_sample_count: 96
  max_poses_per_object: 32
  surface_sample_count: 128
  banned_object_ids: []
  height_map_resolution: [128, 128]
  height_map_margin: 1.0
  render_height_map: true
reward:
  overlap_resolution: 0.03
  posegen_threshold: 1.0
  containment_threshold: 0.5
  nonfinite_displacement: 2.0
  max_displacement: 1.0
  # Placement uncertainty; noisy releases are checked and corrected upward.
  # Unresolved initial collisions always reject while trials are enabled.
  place_stability:
    enabled: true
    n_noise: 4
    position_std: [0.02, 0.02, 0.02]  # Gaussian scales; Z uses abs(sample).
    rotation_std_deg: 5.0
    rotation_weight: 0.1
    # Reject if any noisy trial exceeds the motion limit or does not settle.
    reject_failed_trials: true
    # Worst trial: translation (m) + rotation_weight * angular distance (rad).
    fail_displacement: 0.15
    seed: 0
  weights:
    stability: 2.0
    object_containment: 2.0
    target_overlap_increment: 20.0
    place_stability: 2.0
    large_object_lower: 3.0
    inward_orientation: 6.0
