  width: 1.6
  length: 4.5
  height: 3.0
  origin: [0.0, 0.0, 0.0]
  support_overlap: 0.02
  taper_degrees:
    width_positive: 11.309932474020215
    width_negative: 0.0
    length_positive: 0.0
    length_negative: 0.0
