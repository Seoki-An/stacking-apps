# Legacy standalone batch collection, still usable with --shapes-file.
# Edit ../target_shapes.yml for the CLI and operations GUI target registry.
# Physical SI targets for the full 49-stone excavator catalog.
# Stone hull volume is about 11.53 m^3; targets allow space for voids.
# Box is solid. Pyramid is truncated to keep a usable top for finite stones.
