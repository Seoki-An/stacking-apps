# Explicit CUDA search profile; select with --config.
# Resolved from stacking-planner agent/configs/ablation.yml and Python defaults.
# Native-only controls and CLI override precedence: docs/excavator-planning.md.
units: si
tree:
  max_depth: 4
  iterations: 1024
  max_search_time: 240.0
  max_children: 16
  root_max_children: 32
  exploration_constant: 2.0
  discount: 0.9
  failure_reward: -1.0
  simulation_depth: 5  # Legacy TREE_SIMULATION_DEPTH; absent from ablation.yml.
  initial_depth1_steps: 12  # Depth 1 until 12 objects have been placed.
  root_lookahead: true
widening:
  enabled: true
  coefficient: 3.0
  exponent: 0.5
generation:
  batch_size: 32
  expansion_retry_batches: 3
  min_feasible_children: 3
  attempt_multiplier: 3.0
  evaluation_batch_size: 256  # Stream 128-placement chunks; native robustness capacity is 512.
  # Sample the unfilled active floor before higher placements at every depth.
  root_sampling_priority: lower_floor_first
  deeper_sampling_priority: lower_floor_first
validation:
  max_candidates: 32
  root_before_search: true
  rejected_root_retry_rounds: 3
  time_reserve: 60.0
  max_state_drift: 0.1
final_selection:
  mode: mixed
  max_weight: 0.5  # Legacy default for mode: max_descendant.
  validate_descendant_path: true
  validate_descendant_depth: 2
  require_validated_descendant: true
parallel:
  # Per-scene body/geometry minima cover the full inventory plus target.
  # Batch is the independent number of parallel pose-generation jobs.
  posegen_capacity:
    batch: 512
    bodies: 64
    geometries: 256
    pairs: 4096
    contacts: 512
    incidences: 1024
  posegen_backend: cuda  # cpu or cuda
  simulation_backend: cuda  # cpu or cuda
  # CPU reward/observation workers overlap the next CUDA placement chunk.
  enabled: true
  workers: 4
root_cem:
  population: 96
  elite: 32
  iterations: 3
  keep: 32
  mutation_xy_std: 0.2
  mutation_yaw_std_degrees: 5.0
  fresh_fraction: 0.5
  duplicate_xy_threshold: 0.03
  duplicate_yaw_threshold_degrees: 5.0
  # Keep validation slots available for different stones.
  max_per_object: 2
  height_map_score_weight: 1.0
  seed: 0
bootstrap:
  mean_reward: 2.5
  horizon: 4
