# Independently resolved excavator SI profile; see docs/excavator-planning.md.
units: si
integration:
  dt: 0.01
  gravity: [0.0, 0.0, -9.81]
  damping: 0.0
ground:
  z: 0.0
  friction: 5.0
scene:
  frame_id: 1
physics:
  settling:
    # Independent COM-translation / rotation rates (s^-1).
    # Numerical pose refinement only; not calibrated material dissipation.
    damping:
      linear: 0.5
      angular: 1.0
    contact:
      model: single_point
      error_reduction_ratio: 0.05
      detection_margin: 0.01
    solver:
      constraint_scale_reference: 0.001
      beta_init: 0.1
      beta_update_interval: 50
      max_iters: 2000
      stagnation_window: 0
      tol_abs: 0.001
      tol_rel: 0.0001
  structural:
    # Full structure and robustness must demonstrate stability without damping.
    damping:
      linear: 0.0
      angular: 0.0
    contact:
      model: limit_surface_6d
      patch_eps: 0.00003  # Contact-patch depth allowance, metres.
      error_reduction_ratio: 0.2
      detection_margin: 0.01
    solver:
      constraint_scale_reference: 0.001
      beta_init: 0.1
      beta_update_interval: 50
      max_iters: 2000
      stagnation_window: 0
      tol_abs: 0.0001
      tol_rel: 1.0e-05
phases:
  settling:
    dt: 0.01
    steps: 500
    sample_count: 64
  structural:
    energy_threshold: 0.00001
    velocity_integral_threshold: 0.4
    # Freeze distant stones in XY, retaining the candidate's descending support chain.
    freeze_radius: 3.0
    min_time: 1.0
    max_time: 10.0
    extra_steps: 200
    final_extra_steps: 200
validation:
  contact_gap_tolerance: 0.02
  minimum_support_count: 1
  support_chain_z_tolerance: 0.05
