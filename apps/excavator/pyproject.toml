[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stacking-excavator"
version = "0.1.0"
description = "Offline excavator placement search and native motion planning"
requires-python = ">=3.12"
dependencies = ["stacking-common==0.1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
perception = ["open3d>=0.18"]
operations = ["PySide6>=6.7", "pyvista>=0.44", "pyvistaqt>=0.11", "imageio[ffmpeg]>=2.37"]

[project.scripts]
stacking-excavator-plan = "stacking_excavator.planning.cli:main"
stacking-excavator-emulate-pcd = "stacking_excavator.acquisition.emulation:main"
stacking-excavator-perception = "stacking_excavator.perception.cli:main"
stacking-excavator-simulate = "stacking_excavator.execution.cli:main"
stacking-excavator-emulate = "stacking_excavator.execution.emulation:main"
stacking-excavator-operations = "stacking_excavator.gui.operations.application:main"

[tool.setuptools.packages.find]
where = ["src"]
