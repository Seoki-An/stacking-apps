# Independently resolved tabletop SI profile; distances are in metres.
units: si
stone_sampling:
  # Fresh proposal probability proportional to volume^exponent; 0 restores equal allocation.
  volume_exponent: 1.0
initialization:
  height_clearance: 0.015
  xy_padding: 0.012
filtering:
  # Shared filter policy; physical gap limits are platform-specific.
  strict_floor_first: true
  require_solver_convergence: false
  reject_equilibrium_at_threshold: true
  posegen_equilibrium_threshold: 1.0
  # stacking-core reports the summed penetration residual across active
  # candidate contacts; 3 mm admits the commissioned single-object solves.
  posegen_gap_threshold: 0.003
planar:
  grid_shape: [32, 32]
  # Legacy anchor inset; values below 1 permit controlled target overhang.
  target_anchor_inset_scale: 0.9
  floor:
    coverage_mode: projected_footprint
    bottom_tolerance: 0.02
    # The commissioned six-stone tabletop scene reaches 67.6% after its valid
    # three-stone base and has no collision-free fourth base placement.
    fill_ratio: 0.65
    grid_size: 16
    footprint_scale: 0.9
  boltzmann_temperature: 0.3
  boltzmann_min_probability: 0.0
  target_mask_margin: 0.0
  contact_gap_tolerance: 0.02
  # The only proposal-score weights. Edit these named values for ablations.
  score:
    height: -3.0
    support_likelihood: 2.0
    fill_area: 2.0
    target_boundary: 1.5
    planar_bias: 0.0
    planar_bias_axis: xy
    planar_bias_xy: null
    elite_fraction: 0.25
orientation:
  # true: scan-aligned pickup orientation; false: model principal axes with 0/180° rolls.
  pose_from_scan: true
  # Retain scan-aligned headings while sharing excavator's XY sampler.
  yaw_angles_degrees: [0, 180]
