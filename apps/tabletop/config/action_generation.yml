# Independently resolved tabletop SI profile; distances are in metres.
units: si
stone_sampling:
  # Fresh proposal probability proportional to volume^exponent; 0 restores equal allocation.
  volume_exponent: 0.1
initialization:
  height_clearance: 0.015
  xy_padding: 0.012
filtering:
  # Max XY shift from this proposal's initial pose, in cube-root stone volumes.
  # Checked after posegen and simulation; null disables. Floor retries keep this limit.
  max_initial_xy_displacement_ratio: 0.5
  # Construction order: reject optimized poses above the lowest incomplete layer.
  # Exhausted search advances the floor and recomputes scores; the height gate stays active.
  # false disables this gate for comparisons.
  reject_above_active_layer: true
  # Shared filter policy; physical gap limits are platform-specific.
  require_solver_convergence: false
  reject_equilibrium_at_threshold: true
  posegen_equilibrium_threshold: 0.1
  # stacking-core reports the summed penetration residual across active
  # candidate contacts; 3 mm admits the commissioned single-object solves.
  posegen_gap_threshold: 0.003
planar:
  # Bounded footprint-distance preference at every depth; disconnected poses remain eligible.
  connectivity: previous_action_soft
  # Shared composite proposal grid; empty regional pools retry locally. Floor grids stay separate.
  grid_shape: [32, 32]
  # Proposal inset: smaller values admit edge seeds; solved containment still applies.
  target_anchor_inset_scale: 0.5
  floor:
    coverage_mode: projected_footprint
    bottom_tolerance: 0.02
    # Advance the scoring layer at this projected base coverage.
    fill_ratio: 0.70
    grid_size: 16
    footprint_scale: 0.9
  boltzmann_temperature: 0.3
  boltzmann_min_probability: 0.0
  target_mask_margin: 0.0
  contact_gap_tolerance: 0.02
  # The only proposal-score weights. Edit these named values for ablations.
  score:
    # Maximum distance penalty; length scale is cube root of mean inventory volume.
    previous_action_distance: 1.0
    height: -3.0
    support_likelihood: 2.0
    fill_area: 4.0
    target_boundary: 1.5
    planar_bias: 0.0
    planar_bias_axis: xy
    planar_bias_xy: null
    elite_fraction: 0.25
orientation:
  # true: scan-aligned pickup orientation; false: model principal axes with 0/180° rolls.
  pose_from_scan: false
  roll_angles_degrees: [0, 180]
  yaw_angles_degrees: [0, 90, 180, 270]
