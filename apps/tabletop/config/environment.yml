# Tabletop search-environment values migrated explicitly from the commissioned
# UR5e configuration. These values are not derived from a global scale.
units: si

observation:
  action_sample_count: 96
  max_poses_per_object: 32
  surface_sample_count: 128
  banned_object_ids: []
  height_map_resolution: [128, 128]
  height_map_margin: 0.02
  render_height_map: true

reward:
  overlap_resolution: 0.003
  posegen_threshold: 1.0  # Legacy reward fallback; native equilibrium uses body weight/size.
  containment_threshold: 0.5
  nonfinite_displacement: 0.2
  max_displacement: 0.1
  # Reward unit in metres of combined excursion; matches the current failure limit.
  displacement_reference: 0.015
  # Velocity disturbances from the nominal settled scene; poses stay unchanged.
  place_stability:
    enabled: true
    n_noise: 4  # Number of equally spaced XY directions; each also moves downward.
    # Movable contact neighborhood: 0=candidate only, N=contact links, null=all stones.
    contact_hops: 2
    # Provisional disturbance magnitudes; calibrate to release velocity measurements.
    linear_velocity_magnitude: [0.02, 0.02, 0.02]  # [XY cosine, XY sine, downward Z] m/s; angular velocity is zero.
    rotation_weight: 0.01
    # Reject trials that fail to settle or exceed the peak excursion limit.
    reject_failed_trials: true
    # Translation (m) + rotation_weight * angular displacement (rad).
    fail_displacement: 0.015
  weights:
    stability: 2.0
    object_containment: 2.0
    # Added target volume / initial inventory mean stone volume; average full stone = 1.
    target_overlap_increment: 1.0
    # Reward reduction in (surface max - mean) / mean-stone volume^(1/3), including empty floor.
    surface_flatness: 4.0
    place_stability: 2.0
    large_object_lower: 0.0
    inward_orientation: 0.0
