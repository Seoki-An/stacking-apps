# Tabletop-owned reference geometry for the Operations Console. The ground
# matches the stacking-core plane at z=0. These reference boxes are in the
# search frame; Plan and Execution use the resolved world-frame planning boxes.
units: si

environment:
  default_layers:
    ground: true
    support: true
    obstacle: false

  boxes:
    - id: ground
      layer: ground
      minimum: [-1.0, -1.0, -0.002]
      maximum: [1.0, 1.0, 0.0]
      color: [0.38, 0.50, 0.32]
      opacity: 1.0

    - id: pick_table
      layer: support
      minimum: [-0.5, -1.0, 0.0]
      maximum: [0.5, -0.4, 0.1]
      color: [0.48, 0.34, 0.22]
      opacity: 1.0

    - id: place_table
      layer: support
      minimum: [-0.29, -0.335, -0.04]
      maximum: [0.29, 0.335, 0.0]
      color: [0.48, 0.34, 0.22]
      opacity: 1.0

    - id: third_view_camera
      layer: obstacle
      minimum: [-0.75, -0.90, 0.0]
      maximum: [-0.35, -0.50, 0.8]
      color: [1.0, 1.0, 1.0]
      opacity: 0.20
